<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPI Class Routine</title>
    <style>
        :root {
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --neon-cyan: #00f0ff; 
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.2);
            --call-green: #4CAF50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #000428 0%, #004e92 100%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .glass-container {
            background: rgba(20, 20, 25, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            padding: 25px 20px;
            position: relative;
        }

        /* হেডার ডিজাইন */
        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px auto;
            border: 3px dashed #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            color: #0a192f;
            font-size: 24px;
            font-weight: bold;
        }

        .header h1 {
            font-size: 18px;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .header h2 {
            font-size: 15px;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .header .shift {
            font-size: 16px;
            color: var(--neon-cyan);
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffd700, var(--neon-cyan), transparent);
            margin: 15px 0;
        }

        /* সপ্তাহের দিনের ট্যাব */
        .day-tabs {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 15px;
        }

        .day-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 12px 0;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .day-btn:active {
            transform: scale(0.95);
        }

        .day-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* ডেভেলপার ইনফো */
        .footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer p {
            font-size: 13px;
            color: #ffd700;
            font-weight: bold;
        }

        .footer span {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-top: 3px;
        }

        /* পপ-আপ মডাল ডিজাইন */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            width: 90%;
            max-width: 400px;
            max-height: 85vh;
            padding: 20px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.3); 
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            border-left: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 
                inset 0 0 20px rgba(255, 255, 255, 0.05),
                0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            transform: scale(0.9);
            transition: 0.3s;
        }

        .modal-content.show {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-header h3 {
            color: var(--neon-cyan);
            font-size: 18px;
            text-shadow: 0 0 10px rgba(0,240,255,0.4);
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 0, 0, 0.5);
        }

        /* পপ-আপের ভেতরের রুটিন লিস্ট */
        .routine-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .routine-list::-webkit-scrollbar { width: 5px; }
        .routine-list::-webkit-scrollbar-track { background: transparent; }
        .routine-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }

        .routine-item {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3), inset 0 0 10px rgba(0, 240, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .time-subject {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .subject {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-main);
            line-height: 1.3;
            padding-right: 10px;
        }

        .time {
            font-size: 13px;
            color: #ffd700;
            font-weight: bold;
            white-space: nowrap;
        }

        .teacher-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            background: rgba(0,0,0,0.2);
            padding: 8px 10px;
            border-radius: 8px;
        }

        .teacher-name {
            display: flex;
            flex-direction: column;
        }

        .teacher-name strong {
            color: #bb86fc;
            font-size: 13px;
        }

        .call-btn {
            background: rgba(76, 175, 80, 0.2);
            color: var(--call-green);
            border: 1px solid var(--call-green);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }

        .call-btn:hover, .call-btn:active {
            background: var(--call-green);
            color: #fff;
            box-shadow: 0 0 10px var(--call-green);
        }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            margin-top: 30px;
            margin-bottom: 30px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <div class="header">
            <div class="logo">CPI</div>
            <h1>চট্টগ্রাম গভঃ পলিটেকনিক ইনস্টিটিউট</h1>
            <h2>এনভায়রনমেন্টাল টেকনোলজি বিভাগ</h2>
            <div class="shift">২য় শিফট ক্লাস রুটিন (A2)</div>
        </div>

        <div class="divider"></div>

        <div class="day-tabs">
            <button class="day-btn" onclick="openModal('SUN', 'রবিবার')">রবি</button>
            <button class="day-btn" onclick="openModal('MON', 'সোমবার')">সোম</button>
            <button class="day-btn" onclick="openModal('TUE', 'মঙ্গলবার')">মঙ্গল</button>
            <button class="day-btn" onclick="openModal('WED', 'বুধবার')">বুধ</button>
            <button class="day-btn" onclick="openModal('THU', 'বৃহস্পতিবার')">বৃহঃ</button>
        </div>

        <div class="footer">
            <p>Developed By</p>
            <span style="color: #fff; font-size: 15px; font-weight: bold; margin-top: 5px;">Kakino</span>
            <span>Environmental Technology (CPI)</span>
        </div>
    </div>

    <!-- পপ-আপ মডাল -->
    <div id="routineModal" class="modal" onclick="closeOnOutsideClick(event)">
        <div class="modal-content" id="modalContent">
            <div class="modal-header">
                <h3 id="modalTitle">রুটিন</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="routine-list" id="routineContainer">
                <!-- JS দিয়ে রুটিন এখানে লোড হবে -->
            </div>
        </div>
    </div>

    <script>
        // শিক্ষকদের নাম এবং ফোন নম্বর
        const teachers = {
            "SD": { name: "Sanjib Dhar (SD)", phone: "01823419999" },
            "MS": { name: "Mahmudul Sultan (MS)", phone: "01832088118" },
            "JKH": { name: "JM Kamal Hasan (JKH)", phone: "01823527904" },
            "KH": { name: "Kamal Hasan (KH)", phone: "01668041727" },
            "MSR": { name: "Mosammir Sumaya Rifa (MSR)", phone: "01919030367" },
            "GP": { name: "Gouttam Paul (GP)", phone: "01752997179" },
            "MFB": { name: "Md. Faysul Bari (MFB)", phone: "01673889388" },
            "ET-2": { name: "ET-2", phone: "" }, 
            "NJS": { name: "NJS Sir", phone: "" } 
        };

        // রুটিন ডাটা
        const routineData = {
            "SUN": [
                { time: "1:00 - 3:00", subject: "Basic Environmental Eng (Lab)", teacherCode: "MFB", room: "Evt lab" },
                { time: "3:00 - 3:40", subject: "Chemistry", teacherCode: "KH", room: "CHY-LAB/210" },
                { time: "3:40 - 4:20", subject: "Mathematics-I", teacherCode: "MSR", room: "320" }
            ],
            "MON": [
                { time: "1:00 - 1:40", subject: "Social Science", teacherCode: "JKH", room: "323" },
                { time: "1:40 - 2:20", subject: "Basic Electricity", teacherCode: "ET-2", room: "320" },
                { time: "2:20 - 3:00", subject: "Chemistry", teacherCode: "KH", room: "308" },
                { time: "3:40 - 4:20", subject: "Basic Environmental Eng", teacherCode: "MFB", room: "Evt lab" },
                { time: "4:20 - 5:00", subject: "Mathematics-I", teacherCode: "MSR", room: "321" },
                { time: "5:00 - 5:40", subject: "English-I", teacherCode: "NJS", room: "321" }
            ],
            "TUE": [
                { time: "1:00 - 1:40", subject: "Bangla-I", teacherCode: "SD", room: "305" },
                { time: "1:40 - 3:00", subject: "Basic Electricity", teacherCode: "ET-2", room: "305" },
                { time: "3:00 - 4:20", subject: "Chemistry (Lab)", teacherCode: "KH", room: "CHY-LAB" },
                { time: "4:20 - 5:40", subject: "Mathematics-I", teacherCode: "MSR", room: "321" }
            ],
            "WED": [
                { time: "1:00 - 3:00", subject: "Engineering Drawing", teacherCode: "GP", room: "216" },
                { time: "3:00 - 4:20", subject: "Basic Electricity", teacherCode: "ET-2", room: "BWS-I" },
                { time: "4:20 - 5:40", subject: "Chemistry", teacherCode: "KH", room: "306" }
            ],
            "THU": [
                { time: "1:00 - 3:00", subject: "Engineering Drawing", teacherCode: "GP", room: "212" },
                { time: "3:00 - 3:40", subject: "Basic Environmental Eng", teacherCode: "MFB", room: "Evt lab" },
                { time: "3:40 - 4:20", subject: "Social Science", teacherCode: "JKH", room: "311" },
                { time: "4:20 - 5:00", subject: "English-I", teacherCode: "NJS", room: "308" }
            ]
        };

        function openModal(day, dayName) {
            const modal = document.getElementById('routineModal');
            const modalContent = document.getElementById('modalContent');
            const modalTitle = document.getElementById('modalTitle');
            const container = document.getElementById('routineContainer');

            modalTitle.innerText = `${dayName}র রুটিন`;
            container.innerHTML = ''; 

            const dayRoutine = routineData[day];

            if (!dayRoutine || dayRoutine.length === 0) {
                container.innerHTML = '<div class="empty-msg">এই দিনে কোনো ক্লাস নেই! ছুটি উপভোগ করো।</div>';
            } else {
                dayRoutine.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'routine-item';
                    card.style.animationDelay = `${index * 0.1}s`; 
                    
                    const teacherInfo = teachers[item.teacherCode];
                    let teacherName = teacherInfo ? teacherInfo.name : item.teacherCode;
                    let teacherPhone = teacherInfo ? teacherInfo.phone : "";

                    let callBtnHTML = "";
                    if (teacherPhone) {
                        callBtnHTML = `<a href="tel:${teacherPhone}" class="call-btn">📞 Call</a>`;
                    }

                    card.innerHTML = `
                        <div class="time-subject">
                            <span class="subject">${item.subject}</span>
                            <span class="time">${item.time}</span>
                        </div>
                        <div class="teacher-info">
                            <div class="teacher-name">
                                <strong>${teacherName}</strong>
                                <span>রুম: ${item.room}</span>
                            </div>
                            ${callBtnHTML}
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            modal.style.display = "flex";
            setTimeout(() => {
                modalContent.classList.add('show');
            }, 10);
        }

        // বাইরে ক্লিক করলে বন্ধ করার ফাংশন
        function closeOnOutsideClick(event) {
            const modalContent = document.getElementById('modalContent');
            // যদি ক্লিকটা মডালের ভেতরের কনটেন্টের বাইরে হয় (মানে ব্যাকড্রপে হয়), তবেই বন্ধ হবে
            if (event.target === document.getElementById('routineModal')) {
                closeModal();
            }
        }

        function closeModal() {
            const modal = document.getElementById('modalContent');
            const modalContainer = document.getElementById('routineModal');
            
            modal.classList.remove('show');
            setTimeout(() => {
                modalContainer.style.display = "none";
            }, 300);
        }
    </script>
</body>
</html>
